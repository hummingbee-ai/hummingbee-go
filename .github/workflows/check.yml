name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The two Go releases Go itself supports. go.mod's go line is the older one,
  # so an importer on either builds this module.
  check:
    name: check (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    services:
      postgres:
        image: postgres:14
        env:
          # The service lives only as long as this job, so trust needs no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go }}
      # Installed directly, so make check is the only place the linter runs. The
      # version must match GOLANGCI_LINT_VERSION in the Makefile.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      # GitHub sets CI, so the database specs fail rather than skip if this
      # variable is ever lost.
      - run: make check
        env:
          HUMMINGBEE_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
